[project]
name = "kinetix-dmd-app" 
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alp4lib>=1.1.0",
    "ipykernel>=7.4.0",
    "numpy>=2.5.5",
    "pyside6>=6.12.0",
    "pyvcam",
    "tifffile>=2026.11.16",
]

[project.scripts]
voltcam-dev = "kinetix_dmd_app.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "PyVCAM",
]

[tool.uv.sources]
pyvcam = { workspace = true }
